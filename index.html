function showCountryRel(cid){ const keep = relMode; showCountry(cid); if (keep) { relMode = keep; alFilter = null; restyleAll(); } }

const TT_UA = { defense:"оборонний договір", nonaggression:"пакт про ненапад", economic:"економічна угода", comprehensive:"всебічний договір", ceasefire:"перемир'я", peace:"мир", transit:"транзит військ" };
function termsTxt(t){
  if (!t || typeof t !== "object") return "";
  const out = [];
  if (t.give) { const g = t.give; out.push("передача " + (g.regions === "all_core" ? "усіх рідних земель" : /^border:/.test(g.regions || "") ? g.regions.split(":")[1] + " прикордонних регіонів" : Array.isArray(g.regions) ? g.regions.map(rname).join(", ") : "регіонів") + " від " + cname(g.from) + " до " + cname(g.to)); }
  if (t.reparations) { const r = t.reparations; out.push("репарації " + cname(r.payer) + " → " + cname(r.payee) + ": −" + r.amount + " економіки × " + r.rounds + " раунд(ів)"); }
  if (t.transit) out.push("транзит військ " + cname(t.transit.guest) + " через " + cname(t.transit.host));
  return out.join("; ");
}
function showMe(){
  if (selectedId && FEAT[selectedId]) FEAT[selectedId].layer.setStyle(styleFor(selectedId));
  selectedId = null; if (relMode || alFilter || resFilter) { relMode = null; alFilter = null; resFilter = null; alOpen = null; restyleAll(); }
  let h = "";
  if (!ME) {
    h = "<h2>Вхід</h2><div class='sub'>Увійди через Twitch, щоб бачити свою країну, відносини з іншими державами й пропозиції, які чекають твоєї відповіді.</div>" +
        (S && S.twitch_client ? "<button class='btn main' onclick='twitchLogin()'>Увійти через Twitch</button>" : "<div class='note'>Вхід ще не налаштовано.</div>") +
        "<div class='note'>Сайт бачить лише твій нік і Twitch-ID — нічого не публікує й не пише в чат.</div>";
  } else {
    const p = myPl(), c = myCountry();
    h = "<h2>" + esc(ME.name || ME.login) + "</h2>";
    if (!p || !c) {
      h += "<div class='sub'>Ти ще не граєш.</div><div class='note' style='margin-top:0'>Займи країну в чаті: <b>!роль Країна</b> (або <b>!роль Країна N</b> для міністра).</div>";
    } else {
      const C = S.countries[c], role = p[1];
      const title = role === 0 ? (C.lt || "Лідер") : ["лідер", "міністр оборони", "міністр економіки", "міністр закордонних справ", "міністр внутрішньої політики", "міністр медицини", "міністр освіти і науки"][role] || "";
      h += "<div class='sub'><span class='sw' style='background:" + colorOf(c) + "'></span>" + esc(title) + " · <a href='#' onclick='showCountry(\"" + c + "\");return false' style='color:var(--gold)'>" + esc(cname(c)) + "</a></div>";
      const mine = (S.moves || []).filter(m => String(m.player).toLowerCase() === String(p[2] || ME.login).toLowerCase());
      h += "<div class='row'><span>Ходи цього раунду</span><span><b>" + mine.length + "</b> з 3</span></div>";
      const sg = (x) => { x = Math.round(x * 10) / 10; return x === 0 ? "" : "<b style='color:" + (x > 0 ? "#5fd06a" : "#e2554a") + "'>" + (x > 0 ? "+" : "") + String(x).replace(".", ",") + "</b>"; };
      h += "<h3>Показники</h3>";
      for (const k in STAT_NAMES) { const v = C.s ? C.s[k] : null; if (v == null) continue; const d = C.ds && C.ds[k];
        h += "<div class='row'><span>" + STAT_NAMES[k] + "</span><span>" + (d ? sg(d[0]) + " " + (sg(d[1]) ? "<span style='opacity:.8'>(" + sg(d[1]) + ")</span> " : "") : "") + String(Math.round(v * 10) / 10).replace(".", ",") + "</span></div>"; }
      const pin = (S.proposals || []).filter(x => x.to === c), pout = (S.proposals || []).filter(x => x.from === c);
      h += "<h3>Пропозиції нам</h3>" + (pin.length ? pin.map(x => "<div class='row' style='display:block'><b>#" + x.id + "</b> " + esc(cname(x.from)) + " — " + esc(TT_UA[x.type] || x.type) +
           (termsTxt(x.terms) ? "<div class='note' style='margin:2px 0 0'>" + esc(termsTxt(x.terms)) + "</div>" : "") + "<div class='note' style='margin:2px 0 0'>!пропозиція так " + x.id + " · ні " + x.id + " · контр " + x.id + " умови</div></div>").join("")
           : "<div class='note' style='margin-top:0'>немає</div>");
      if (pout.length) h += "<h3>Наші пропозиції</h3>" + pout.map(x => "<div class='row'><span>#" + x.id + " " + esc(cname(x.to)) + "</span><span>" + esc(TT_UA[x.type] || x.type) + " · чекає</span></div>").join("");
      const ops = (S.ops || []).filter(o => String(o.by) === String(ME.id));
      if (ops.length) {
        const OPN = { siege:"облога", air_blockade:"закрите небо", naval_blockade:"морська блокада", strait_blockade:"блокада протоки" };
        h += "<h3>Мої операції</h3>" + ops.map(o => "<div class='row'><span>#" + o.id + " " + esc(OPN[o.type] || o.type) + " — " + esc(o.type === "strait_blockade" ? o.name : o.type === "naval_blockade" ? cname(o.target) : rname(o.target)) + "</span><span>" +
             (o.started === S.round ? "нова" : o.confirmed === S.round ? "✓ продовжено" : "<b style='color:#ffcf6b'>чекає !облога так " + o.id + "</b>") + "</span></div>").join("");
      }
      const tr = (S.treaties || []).filter(t => t.a === c || t.b === c);
      if (tr.length) h += "<h3>Договори</h3>" + tr.map(t => "<div class='row'><span>" + (TR_UA[t.t] || t.t) + "</span><span>" + esc(cname(t.a === c ? t.b : t.a)) + "</span></div>").join("");
      h += "<div style='margin-top:14px'><button class='btn main' onclick='showRelations()'>🤝 Відносини на карті</button></div>";
    }
    h += "<div class='note'><a href='#' onclick='twitchLogout();return false' style='color:var(--muted)'>Вийти</a></div>";
  }
  document.getElementById("pbody").innerHTML = h;
  document.getElementById("panel").style.display = "block";
}
function showPlayers(){
  if (!S) return;
  if (selectedId && FEAT[selectedId]) FEAT[selectedId].layer.setStyle(styleFor(selectedId));
  selectedId = null; if (relMode || alFilter || resFilter) { relMode = null; alFilter = null; resFilter = null; alOpen = null; restyleAll(); }
  const cs = Object.keys(S.countries).filter(c => (S.countries[c].players || []).length).sort((a, b) => S.countries[b].players.length - S.countries[a].players.length || cname(a).localeCompare(cname(b)));
  let n = 0; cs.forEach(c => n += S.countries[c].players.length);
  let h = "<h2>Гравці</h2><div class='sub'>" + n + " гравців у " + cs.length + " країнах · клік — країна на карті</div>";
  for (const c of cs) {
    h += "<div class='al' onclick='showCountry(\"" + c + "\")'><span><span class='sw' style='background:" + colorOf(c) + "'></span>" + esc(cname(c)) + "</span><span>" + S.countries[c].players.length + "</span></div>";
    h += "<div class='note' style='margin:2px 0 8px'>" + S.countries[c].players.slice().sort((a, b) => a.role - b.role).map(x => esc(x.name) + " <span style='opacity:.7'>(" + esc(x.role_name) + ")</span>").join(", ") + "</div>";
  }
  if (!cs.length) h += "<div class='note'>Поки ніхто не грає. Зайняти країну: <b>!роль Країна</b></div>";
  document.getElementById("pbody").innerHTML = h;
  document.getElementById("panel").style.display = "block";
}

// ---------- Twitch (implicit flow: токен лише в браузері, сайт дізнається тільки ID і нік) ----------
function twitchLogin(){
  if (!S || !S.twitch_client) return toast("Вхід ще не налаштовано");
  const st = Math.random().toString(36).slice(2); try { sessionStorage.setItem("geoState", st); } catch (e) {}
  location.href = "https://id.twitch.tv/oauth2/authorize?client_id=" + encodeURIComponent(S.twitch_client) + "&redirect_uri=" + encodeURIComponent(location.origin + location.pathname) +
                  "&response_type=token&scope=&state=" + st;
}
function twitchLogout(){ ME = null; try { localStorage.removeItem("geoMe"); } catch (e) {} renderTop(); showMe(); }
async function twitchCallback(){
  const h = new URLSearchParams(location.hash.slice(1));
  const tok = h.get("access_token"); if (!tok) return;
  history.replaceState(null, "", location.pathname + location.search);
  let st = null; try { st = sessionStorage.getItem("geoState"); } catch (e) {}
  if (st && h.get("state") !== st) return toast("Вхід скасовано: невідповідність state");
  const tries = 20; for (let i = 0; i < tries && !(S && S.twitch_client); i++) await new Promise(r => setTimeout(r, 300));
  try {
    const r = await fetch("https://api.twitch.tv/helix/users", { headers:{ "Authorization":"Bearer " + tok, "Client-Id": S.twitch_client } });
    const j = await r.json(); const u = j.data && j.data[0]; if (!u) throw new Error("немає користувача");
    ME = { id:u.id, login:u.login, name:u.display_name || u.login };
    try { localStorage.setItem("geoMe", JSON.stringify(ME)); } catch (e) {}
    renderTop(); showMe();
  } catch (e) { toast("Не вдалося увійти через Twitch"); }
}

// ---------- архів хроніки: старіші раунди підвантажуються з chron/<світ>/<раунд>.json ----------
const ARCH = {};   // раунд → статті
function mergeArchive(){
  if (!S || !S.chronicle) return;
  const have = new Set(S.chronicle.map(a => a.round));
  Object.keys(ARCH).map(Number).sort((a, b) => b - a).forEach(r => { if (!have.has(r)) S.chronicle.push(...ARCH[r]); });
}
function olderRounds(){
  if (!S || !S.chron_rounds) return [];
  const have = new Set((S.chronicle || []).map(a => a.round));
  return S.chron_rounds.filter(r => !have.has(r)).sort((a, b) => b - a);
}
async function loadOlder(){
  const rs = olderRounds().slice(0, 5); if (!rs.length) return;
  for (const r of rs) { try { const x = await (await fetch("chron/" + S.world + "/" + r + ".json?v=" + (S.published || ""))).json(); ARCH[r] = x; } catch (e) { ARCH[r] = []; } }
  const keep = clist.scrollTop; mergeArchive(); renderChronicle(); clist.scrollTop = keep;
}

// ---------- завантаження стану ----------
let lastPub = null;
async function loadState(){
  try {
    const d = await (await fetch("state.json?t=" + Date.now(), { cache:"no-store" })).json();
    if (d.published && d.published === lastPub) return;
    const first = !S; lastPub = d.published;
    for (const r in ARCH) if (!S || S.world !== d.world || +r >= d.round) delete ARCH[r];   // новий світ або відкат
    animateNext = !first && d.round > S.round;
    d.chronicle = d.chronicle || [];
    S = d; mergeArchive();
    applyState(S);
    if (first && location.hash.includes("access_token")) twitchCallback();
  } catch (e) { if (!S) document.getElementById("cmeta").textContent = "не вдалося завантажити стан світу"; }
}

document.getElementById("bPl").onclick = showPlayers;
document.getElementById("bMe").onclick = showMe;
document.getElementById("bRelM").onclick = showRelations;
document.getElementById("chead").addEventListener("click", e => { if (innerWidth <= 820 && !e.target.closest("button")) document.getElementById("chron").classList.toggle("open"); });

if (window.TEST_PREV) { applyState(window.TEST_PREV); }
if (window.TEST_STATE) { animateNext = !!window.TEST_PREV; applyState(window.TEST_STATE); }
else if (SITE) { drawBorders(); rebuildLabels(); updateLabels(); renderTop(); loadState(); setInterval(loadState, 60000); document.addEventListener("visibilitychange", () => { if (!document.hidden) loadState(); }); }
else { drawBorders(); rebuildLabels(); updateLabels(); renderTop(); connect(); }
</script>
